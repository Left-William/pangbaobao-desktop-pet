name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate asset structure
        run: python tools/assets/validate_assets.py
      - name: Smoke tests
        run: dotnet run --project tests/PangBaoBaoPet.Tests/PangBaoBaoPet.SmokeTests.csproj -c Release
      - name: Publish desktop app
        run: dotnet publish src/PangBaoBaoPet.Desktop/PangBaoBaoPet.csproj -c Release --self-contained false -o dist/PangBaoBaoPet
      - uses: actions/upload-artifact@v4
        with:
          name: PangBaoBaoPet-Preview-Windows
          path: dist/PangBaoBaoPet/
